spring.application.name=payroll-management-system
server.port=8080

# Import local credentials if present (application-local.properties in project root)
spring.config.import=optional:file:./application-local.properties

# Fallback defaults if not set in environment or local config
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/payroll_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:payroll_app}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Logging
logging.level.com.payroll=INFO
logging.level.org.springframework.security=INFO